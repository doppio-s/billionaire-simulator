# 入口まわり（index.html / manifest / sw.js）をサーバーの最新に合わせる。
#
# GitHub Pages の index.html は「入口」。ここに来た人は、これがサーバーから
# 本体を読みに行くので、いつでも最新の版で遊べる。
# ホーム画面に入れるための manifest と sw.js も、同じくサーバーに置いてある。
#
# 手で動かす時： Actions タブ → この仕事 → Run workflow
name: 入口を最新にする

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3,9,15,21 * * *"    # もう一つの仕事とぶつからない時刻にしてある

permissions:
  contents: write

concurrency:
  group: pages-write
  cancel-in-progress: false

jobs:
  entry:
    runs-on: ubuntu-latest
    env:
      SB: https://cyrqnamvghjdwrrtdiog.supabase.co/rest/v1/rpc/web_get
      KEY: sb_publishable_k7yH1S8exErs95du4whl6Q_JX-rkqdA
    steps:
      - uses: actions/checkout@v4

      - name: サーバーから取ってくる
        run: |
          set -euo pipefail
          pull () {  # $1=サーバー上の名前  $2=置き先  $3=最小バイト数
            curl -sS --fail --retry 3 --retry-delay 5 -X POST "$SB" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -d "{\"p_path\":\"$1\"}" | jq -j '.body' > tmp.out
            test -s tmp.out
            [ "$(wc -c < tmp.out)" -ge "$3" ]     || { echo "$2 が小さすぎる"; exit 1; }
            [ "$(wc -c < tmp.out)" -le 200000 ]   || { echo "$2 が大きすぎる"; exit 1; }
            mv tmp.out "$2"
            echo "  $2 $(wc -c < "$2") バイト"
          }
          pull loader.html  index.html            3000
          pull gh_manifest  manifest.webmanifest   200
          pull gh_sw        sw.js                  400
          # 入口が本物か、中身で確かめる
          head -c 40 index.html | grep -qi '<!doctype html' || { echo "HTMLではない"; exit 1; }
          grep -q 'web_ver'    index.html || { echo "入口ではない"; exit 1; }
          grep -q 'full.html'  index.html || { echo "予備の指定がない"; exit 1; }
          grep -q 'manifest'   index.html || { echo "ホーム画面用の指定がない"; exit 1; }
          jq -e '.name and .start_url and (.icons|length>0)' manifest.webmanifest > /dev/null

      - name: 変わっていたら記録する
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js
          if git diff --staged --quiet; then
            echo "変わっていないので、何もしない"
          else
            git commit -m "入口・ホーム画面用のファイルをサーバーの最新に合わせた"
            git pull --rebase --autostash
            git push
            echo "更新した"
          fi
