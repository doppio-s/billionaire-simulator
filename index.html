<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>社畜シミュレーター</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#151011">
<meta name="color-scheme" content="dark">
<meta name="description" content="非ドパガキ向け。街の端のボロ家から日銭を稼ぎ、土地を買い、会社を興す。同じ街に住んでいるのは、本物の他のプレイヤーです。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="社畜シミュレーター">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="社畜シミュレーター">
<meta property="og:description" content="非ドパガキ向け。みんなで一つの街。">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
html,body{margin:0;height:100%;background:#0b0d12;color:#e8e2d6;overflow:hidden;
 font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif}
#f{border:0;width:100%;height:100%;display:block}
#f[hidden],#s[hidden]{display:none!important}
#s{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:14px;text-align:center;padding:24px;box-sizing:border-box}
#s b{font-size:19px;color:#e2b258}
#s p{font-size:13px;opacity:.78;margin:0;line-height:1.8}
#s a{color:#e2b258}
.dot{width:34px;height:34px;border:3px solid rgba(226,178,88,.22);
 border-top-color:#e2b258;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#t{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9;
 background:rgba(20,16,9,.94);border:1px solid rgba(226,178,88,.45);color:#e7c176;
 padding:9px 15px;border-radius:999px;font-size:12.5px;white-space:nowrap}
</style>
</head>
<body>
<div id="s"><div class="dot"></div><b>社畜シミュレーター</b><p>本体を読み込んでいます…</p></div>
<iframe id="f" hidden allow="autoplay; fullscreen; clipboard-write"></iframe>
<script>
/* ホーム画面に入れられるようにする受付係を登録する。
   置いてあるだけでは何も起きないので、ここから呼ぶ。
   file:// で開いた時は使えないので、その時は黙って諦める */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
/* 本体はサーバー（Supabase）に置いてある。ここはそれを読みに行くだけの薄い1枚。
   版だけ先に聞いて、変わっていなければ前に読んだものをそのまま使う（通信を使わない）。
   サーバーに行けない時は、前に読んだもの → 予備の置き場、の順で粘る。 */
var API="https://cyrqnamvghjdwrrtdiog.supabase.co/rest/v1/rpc/";
var KEY="sb_publishable_k7yH1S8exErs95du4whl6Q_JX-rkqdA";
var SPARE="https://doppio-s.github.io/billionaire-simulator/";
var PATH={ja:"index.html", en:"en.html"};
var SPARE_PATH={ja:"full.html", en:"en/index.html"};   /* 予備の置き場（GitHub Pages）での置き場所。
   そこの index.html はこの入口そのものなので、本体は full.html に置いてある */
var f=document.getElementById("f"), s=document.getElementById("s"), cur=null, busy=0;

function toast(m){
  var e=document.getElementById("t"); if(e)e.remove();
  e=document.createElement("div"); e.id="t"; e.textContent=m;
  document.body.appendChild(e); setTimeout(function(){ e&&e.remove(); },4500);
}
function cacheGet(){ try{ return JSON.parse(localStorage.getItem("bs_cache")||"null"); }catch(_){ return null; } }
function cacheSet(lang,ver,body){
  try{ localStorage.setItem("bs_cache",JSON.stringify({lang:lang,ver:ver,body:body})); }
  catch(_){ try{ localStorage.removeItem("bs_cache"); }catch(__){} }
}
function rpc(fn,args){
  return fetch(API+fn,{method:"POST",cache:"no-store",
    headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},
    body:JSON.stringify(args)})
    .then(function(r){ if(!r.ok) throw new Error("rpc"); return r.json(); });
}
function show(lang,ver,html){
  var other=(lang==="ja")?"en":"ja";
  /* 中の本体に「いま何版を読んだか」を知らせる。
     本体はこれを見て、新しいのが出たら自分から読み直す */
  window.__ver=ver||null; window.__path=PATH[lang];
  html=html.replace(/href="(?:en\/index\.html|\.\.\/index\.html)"/,
    'href="#" onclick="parent.__swap(\''+other+'\');return false;"');
  f.srcdoc=html; f.hidden=false; s.hidden=true; cur=lang;
}
function fail(){
  s.hidden=false; f.hidden=true;
  s.innerHTML='<b>読み込めませんでした</b><p>通信が不安定かもしれません。'
   +'少し待ってから開き直してください。<br>それでもだめなときは、こちらから遊べます。<br>'
   +'<a href="'+SPARE+'" target="_blank" rel="noopener">'+SPARE+'</a></p>';
}
function load(lang){
  if(busy)return; busy=1;
  var first=(cur===null);
  if(first){ s.hidden=false; f.hidden=true; }
  var c=cacheGet();
  /* 機内モードなどで最初から繋がっていない時は、25秒待たせない。
     前に読んだものがあるなら、すぐそれを出す */
  if(navigator.onLine===false && c && c.lang===lang && c.body){
    busy=0; show(lang,c.ver,c.body); toast("通信が切れています。前の版で遊べます");
    addEventListener("online",function(){ if(!busy)load(lang); },{once:true});
    return;
  }
  var late=setTimeout(function(){ if(busy){ busy=0; back(lang,first,"時間がかかりすぎました"); } },
    navigator.onLine===false?3000:25000);
  rpc("web_ver",{p_path:PATH[lang]})
    .then(function(ver){
      if(c && c.lang===lang && c.ver && c.ver===ver && c.body){
        clearTimeout(late); busy=0; show(lang,ver,c.body); return null;   /* 変わっていない */
      }
      return rpc("web_get",{p_path:PATH[lang]});
    })
    .then(function(g){
      if(g===null)return;
      clearTimeout(late); if(!busy)return; busy=0;
      if(!g||!g.body) throw new Error("empty");
      cacheSet(lang,g.ver,g.body); show(lang,g.ver,g.body);
    })
    .catch(function(){
      clearTimeout(late); if(!busy)return; busy=0;
      back(lang,first,"いま最新を取りに行けませんでした");
    });
}
/* 粘る：前に読んだもの → 予備の置き場 */
function back(lang,first,why){
  var c=cacheGet();
  if(c && c.lang===lang && c.body){ show(lang,c.ver,c.body); toast(why+"。前の版で遊べます"); return; }
  fetch(SPARE+SPARE_PATH[lang],{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .then(function(t){ show(lang,null,t); toast(why+"。予備の置き場から読みました"); })
    .catch(function(){ if(!first&&cur){ toast(why); s.hidden=true; f.hidden=false; } else fail(); });
}
window.__swap=load;
/* ブラウザの言語で決める。手で切り替えたら覚えておく */
var saved=null; try{ saved=localStorage.getItem("bs_lang"); }catch(_){}
var q=(location.search.indexOf("lang=en")>=0)?"en":(location.search.indexOf("lang=ja")>=0)?"ja":null;
var auto=/^ja/i.test(navigator.language||"")?"ja":"en";
load(q||saved||auto);
var _sw=window.__swap;
window.__swap=function(l){ try{ localStorage.setItem("bs_lang",l); }catch(_){} _sw(l); };
</script>
</body>
</html>
